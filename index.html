<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" as="fetch" crossorigin href="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/ferrari.glb">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body class="loading">
<!-- Ambiente e hora do dia -->
<header id="top">
  <div id="scenes" class="seg glass" role="group" aria-label="Ambiente"></div>
  <button id="btnNight" class="orb glass" aria-pressed="false" aria-label="Noite" data-tip="Dia ou noite">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M19.6 14.2A8 8 0 0 1 9.8 4.4a8 8 0 1 0 9.8 9.8z"/></svg>
  </button>
</header>

<div id="spots"></div>

<article id="card" class="glass" hidden>
  <button class="close" aria-label="Fechar"></button>
  <h3></h3>
  <p class="text"></p>
  <dl class="specs"></dl>
</article>

<aside id="sheet" class="glass" hidden>
  <header>
    <button class="close" aria-label="Fechar"></button>
    <h3>Ficha técnica</h3>
  </header>
  <div id="sheetBody"></div>
</aside>

<!-- Barra do carro: velocidade (só na estrada), cores e o que mostrar -->
<footer id="foot">
  <p id="hint" class="hidden"><span class="glass"></span></p>
  <section id="layersPop" class="glass" aria-label="Camadas" hidden>
    <div class="seg" id="bodyMode" role="group" aria-label="Carroceria"></div>
    <div class="chips" id="layers"></div>
    <button class="link" id="btnSheet">Ficha técnica</button>
  </section>
  <div id="dock" class="glass">
    <section id="drive" aria-label="Velocidade" hidden>
      <output id="speedNow">0</output><small>km/h</small>
      <input id="speedInput" type="range" min="0" max="320" step="5" value="100" aria-label="Velocidade desejada">
    </section>
    <div id="bar">
      <div class="swatches" id="colors" role="group" aria-label="Cor"></div>
      <i class="rule"></i>
      <button class="tool" id="btnView" aria-pressed="false" aria-label="Interior" data-tip="Interior">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.1"/><path d="M12 14.1v6.5M10 11.3l-6.3-1.6M14 11.3l6.3-1.6"/></svg>
      </button>
      <button class="tool" id="btnLights" aria-pressed="false" aria-label="Faróis" data-tip="Faróis">
        <svg viewBox="0 0 24 24"><path d="M12 5.2c4.2 0 7.5 3 7.5 6.8s-3.3 6.8-7.5 6.8V5.2z"/><path d="M3.5 7.6h5M3.5 12h5M3.5 16.4h5"/></svg>
      </button>
      <button class="tool" id="btnSpots" aria-pressed="false" aria-label="Pontos de informação" data-tip="Pontos de informação">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v5.2M12 7.7v.1"/></svg>
      </button>
      <button class="tool" id="btnLayers" aria-expanded="false" aria-controls="layersPop" aria-label="Camadas" data-tip="Camadas">
        <svg viewBox="0 0 24 24"><path d="M12 3.6 3.4 8.2l8.6 4.6 8.6-4.6L12 3.6z"/><path d="M3.4 12.2l8.6 4.6 8.6-4.6M3.4 16.2l8.6 4.6 8.6-4.6"/></svg>
      </button>
    </div>
  </div>
</footer>

<div id="status"><output>0</output><i><u></u></i></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
